<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="JapanTech Engineering Knowledge">

    <meta name="author"
          content="JapanTech">

    <title>Article Template | JapanTech</title>

    <!-- Base -->
    <link rel="stylesheet" href="../../css/base/reset.css">
    <link rel="stylesheet" href="../../css/base/variables.css">
    <link rel="stylesheet" href="../../css/base/typography.css">
    <link rel="stylesheet" href="../../css/base/base.css">

    <!-- Layout -->
    <link rel="stylesheet" href="../../css/layout/header.css">
    <link rel="stylesheet" href="../../css/layout/footer.css">

    <!-- Common -->
    <link rel="stylesheet" href="../../css/common/table.css">
    <link rel="stylesheet" href="../../css/common/image.css">
    <link rel="stylesheet" href="../../css/common/callout.css">
    <link rel="stylesheet" href="../../css/common/tag.css">
    <link rel="stylesheet" href="../../css/common/badge.css">
    <link rel="stylesheet" href="../../css/common/toc.css">

    <!-- Page -->
    <link rel="stylesheet" href="../../css/pages/article.css">

    <!-- Responsive -->
    <link rel="stylesheet" href="../../css/responsive.css">

</head>
<button
    id="backToTop"
    class="back-to-top"
    aria-label="Back to Top">

    ↑

</button>

<script src="../../js/layout/back-to-top.js"></script>
<body>

    <!-- ========================= -->
    <!-- Header -->
    <!-- ========================= -->

    <div id="header"
         data-component="../../components/layout/header.html">
    </div>

    <!-- ========================= -->
    <!-- Main -->
    <!-- ========================= -->

    <main class="article-container">

        <!-- Breadcrumb -->

        <nav class="breadcrumb">

            <a href="../../index.html">Home</a>

            <span>/</span>

            <a href="../../knowledge/index.html">Knowledge</a>

            <span>/</span>

            <a href="../index.html">Machine Design</a>

            <span>/</span>

            <span>Article Title</span>

        </nav>

        <!-- Hero -->

        <section class="article-hero">

            <div class="article-category">

                Machine Design

            </div>

            <h1>

                Article Title

            </h1>

            <p class="article-description">

                Short article description...

            </p>

            <img src="../../assets/images/articles/default-cover.webp"
                 alt="Article Cover">

        </section>

        <!-- Meta -->

        <section class="article-meta">

            <span>Updated : 2026-07-23</span>

            <span>Reading : 10 min</span>

            <span>Level : Beginner</span>

        </section>

        <!-- Content -->

        <section class="article-layout">

            <article class="article-content">

                <h2 id="overview">

                    1. Overview

                </h2>

                <p>

                    Write your content here...

                </p>

            </article>

            <!-- TOC -->

            <aside class="article-toc">

                <h3>

                    Contents

                </h3>

                <ul>

                    <li>

                        <a href="#overview">

                            Overview

                        </a>

                    </li>

                </ul>

            </aside>

        </section>

        <!-- Previous / Next -->

        <section class="article-navigation">

            <a href="#">

                ← Previous

            </a>

            <a href="#">

                Next →

            </a>

        </section>

        <!-- Related -->

        <section class="related-articles">

            <h2>

                Related Articles

            </h2>

        </section>

        <!-- Author -->

        <section id="author"
                 data-component="../../components/common/author-box.html">
        </section>

    </main>

    <!-- ========================= -->
    <!-- Footer -->
    <!-- ========================= -->

    <div id="footer"
         data-component="../../components/layout/footer.html">
    </div>

    <!-- Back To Top -->

    <button id="backToTop">

        ↑

    </button>

    <!-- JavaScript -->

    <script src="../../js/core/component-loader.js"></script>

    <script src="../../js/layout/navigation.js"></script>

    <script src="../../js/layout/back-to-top.js"></script>

    <script src="../../js/common/toc.js"></script>

    <script src="../../js/pages/article.js"></script>

</body>

</html>
